<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#19120f">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets-runtime/images/icons/augustus.png?v=2">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="./assets-runtime/images/icons/augustus.ico?v=2">
    <title>AUGUSTUS</title>
    <style>
      :root { color-scheme: dark; background: #19120f; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body { position: relative; font-family: system-ui, sans-serif; }
      #bevy {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #e9cc9c;
        font-size: 40px;
        font-weight: 700;
        text-align: center;
        pointer-events: none;
      }
      #status::before {
        content: "";
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status.error { padding: 1rem; color: #ffb4a9; font-size: 16px; pointer-events: auto; }
      #status.error::before { display: none; }
    </style>
  </head>
  <body>
    <canvas id="bevy" aria-label="Augustus game canvas"></canvas>
    <p id="status" role="status">Loading</p>
    <script type="module">
      import init from "./augustus.js";

      // Canvas clipboard access needs a click in the page context. Start the read
      // from the menu's Paste action and deliver its result to egui on the next frame.
      let pendingPaste;
      window.augustusCopyText = (text) => {
        if (!window.isSecureContext || !navigator.clipboard?.writeText) return false;

        try {
          navigator.clipboard.writeText(String(text)).catch((error) => {
            console.warn("Clipboard write was rejected", error);
          });
          return true;
        } catch (error) {
          console.warn("Clipboard write was unavailable", error);
          return false;
        }
      };
      window.augustusRequestPaste = () => {
        pendingPaste = null;
        try {
          if (window.isSecureContext && navigator.clipboard?.readText) {
            navigator.clipboard.readText().then(
              (text) => { pendingPaste = String(text); },
              (error) => {
                console.warn("Clipboard read was rejected", error);
                pendingPaste = false;
              },
            );
            return true;
          }
        } catch (error) {
          console.warn("Clipboard read was unavailable", error);
        }
        pendingPaste = false;
        return false;
      };
      window.augustusTakePaste = () => {
        const result = pendingPaste;
        if (typeof result === "string" || result === false) pendingPaste = undefined;
        return result;
      };

      const status = document.querySelector("#status");
      // The game handles wheel input itself for province-map zoom.
      document.addEventListener("wheel", (event) => event.preventDefault(), { passive: false });
      // Right-click is also game input; keep the browser context menu from covering the canvas.
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = "Augustus could not start. Reload the page or check the browser console.";
        status.classList.add("error");
      }
    </script>
  </body>
</html>
