[package]
name = "augustus"
version = "0.1.0"
edition = "2021"
default-run = "augustus"
authors = ["Mavs"]
description = "A historical strategy game for desktop and WebAssembly"

[[bin]]
name = "build-assets"
path = "scripts/build-assets.rs"
required-features = ["asset-pipeline"]

[features]
default = ["app"]
app = []
asset-pipeline = ["dep:hex", "dep:sha2"]

[dependencies]
base64 = "0.23.1"
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "webgl2",
] }
bevy_egui = { version = "0.42.0", default-features = false, features = [
    "bevy_ui",
    "default_fonts",
    "manage_clipboard",
    "render",
] }
bevy_kira_audio = "0.26.0"
basisu = "0.1.0"
hex = { version = "0.4.3", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", optional = true }
thiserror = "2.0.20"
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "multi_threaded",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["Window"] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = "0.30.13"

# Keep moderate optimization in local Bevy development builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
